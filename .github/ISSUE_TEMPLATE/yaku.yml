name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 上里春生 詩篇（『沖縄文学全集 第1巻 詩Ⅰ』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: uezato-haruo-fe131e7c-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
